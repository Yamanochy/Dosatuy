<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Досатуй — Вахта 45×45</title>
<meta name="theme-color" content="#14213D" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Досатуй" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          diesel: { DEFAULT: "#14213D", 700: "#1B2C50", 500: "#26406E" },
          route:  { DEFAULT: "#F2A93B", 600: "#D98F1F" },
          brick:  { DEFAULT: "#C6432B" },
          shift:  { DEFAULT: "#2F9E64" },
          paper:  { DEFAULT: "#FAFAF8" },
        },
        fontFamily: {
          display: ["'Space Grotesk'", "sans-serif"],
          sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          mono: ["'JetBrains Mono'", "monospace"],
        },
      },
    },
  };
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #EEF0F3; }
  .font-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .tab-active { color: #14213D !important; }
  .tab-active .tabicon { transform: translateY(-2px); color: #F2A93B; }
  .tab-active::after { content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 20px; height: 2.5px; border-radius: 2px; background: #F2A93B; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  .hidden { display: none; }
  /* дорожная шкала — фирменный индикатор положения в цикле вахты */
  .roadscale { position: relative; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, #E2E5EA 0 6px, transparent 6px 12px); }
  .roadscale-fill { position: absolute; inset: 0; border-radius: 3px; background: #14213D; }
  /* сигнальная штриховка, как на кузовах техники — вместо плоской линии-подчёркивания */
  .hazard-strip { height: 7px; background-image: repeating-linear-gradient(-45deg, #F2A93B 0 10px, #14213D 10px 20px); border-bottom: 1px solid rgba(0,0,0,0.15); }
</style>
</head>
<body class="min-h-screen pb-24">

  <div id="auth-screen"></div>

  <div id="app-shell" class="hidden">
    <header class="bg-diesel text-white px-4 pt-6 pb-0">
      <div class="flex items-center text-xs mb-2" id="user-bar"></div>
      <div class="text-[11px] uppercase tracking-[0.2em] text-white/50 font-semibold font-num">п. Досатуй</div>
      <div class="flex items-center gap-2.5">
        <img src="icon-192.png" alt="" class="w-10 h-10 rounded-full object-cover ring-2 ring-route/60 shadow" />
        <div class="text-2xl font-bold font-display tracking-tight">Вахта водителей Шакман</div>
      </div>
      <div class="text-xs text-white/60 mt-1 mb-3.5 font-num tracking-wide">РОТАЦИЯ 45 / 45 · ГК «КРОНА»</div>
      <div class="hazard-strip"></div>
    </header>

    <main id="app" class="max-w-md mx-auto px-3 mt-4 space-y-3"></main>

    <nav id="nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-2 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]"></nav>
  </div>

  <script src="firebase-config.js"></script>
  <script src="cloud-config.js"></script>
  <script src="vapid-config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="docs.js"></script>
  <script src="timesheet.js"></script>
  <script src="stats.js"></script>
  <script src="chat.js"></script>
  <script src="notifications.js"></script>
  <script src="auth.js"></script>
</body>
</html>
