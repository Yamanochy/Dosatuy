<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Досатуй — Вахта 45×45</title>
<meta name="theme-color" content="#14213D" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Досатуй" />
<script>
  // применяем сохранённую тему ДО отрисовки страницы — иначе на тёмной
  // теме был бы короткий "бело-серый" мигающий экран при каждом запуске
  if (localStorage.getItem("vahta-theme") === "dark") document.documentElement.classList.add("dark");
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          diesel: { DEFAULT: "#14213D", 700: "#1B2C50", 500: "#26406E" },
          route:  { DEFAULT: "#F2A93B", 600: "#D98F1F" },
          brick:  { DEFAULT: "#C6432B" },
          shift:  { DEFAULT: "#2F9E64" },
          paper:  { DEFAULT: "#FAFAF8" },
        },
        fontFamily: {
          display: ["'Space Grotesk'", "sans-serif"],
          sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          mono: ["'JetBrains Mono'", "monospace"],
        },
      },
    },
  };
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #EEF0F3; transition: background .15s; }
  html.dark body { background: #0B1220; }
  .font-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .tab-active { color: #F2A93B !important; }
  .tab-active .tabicon { transform: translateY(-2px); }
  .tab-active .tabicon-wrap { background: rgba(242,169,59,0.16); }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  .hidden { display: none; }
  /* дорожная шкала — фирменный индикатор положения в цикле вахты */
  .roadscale { position: relative; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, #E2E5EA 0 6px, transparent 6px 12px); }
  html.dark .roadscale { background-image: repeating-linear-gradient(90deg, #334155 0 6px, transparent 6px 12px); }
  .roadscale-fill { position: absolute; inset: 0; border-radius: 3px; background: #14213D; }
  html.dark .roadscale-fill { background: #6B8AC4; }

  /* ===== ТЁМНАЯ ТЕМА =====
     Весь интерфейс построен на небольшом наборе повторяющихся классов
     Tailwind (bg-white, text-slate-*, border-slate-*) — переопределяем
     сами эти классы под .dark на <html>, а не расставляем dark:-варианты
     в каждом файле по отдельности. !important — потому что стили
     Tailwind CDN подключаются позже этого блока и иначе перебивают его. */
  html.dark .bg-white { background-color: #1E293B !important; }
  html.dark .bg-slate-50 { background-color: #172033 !important; }
  html.dark .bg-slate-100 { background-color: #334155 !important; }
  html.dark .bg-slate-200 { background-color: #475569 !important; }
  html.dark .border-slate-100 { border-color: #334155 !important; }
  html.dark .border-slate-200 { border-color: #334155 !important; }
  html.dark .divide-slate-100 > :not([hidden]) ~ :not([hidden]) { border-color: #334155 !important; }
  html.dark .text-slate-800 { color: #F1F5F9 !important; }
  html.dark .text-slate-700 { color: #E2E8F0 !important; }
  html.dark .text-slate-600 { color: #CBD5E1 !important; }
  html.dark .text-slate-500 { color: #94A3B8 !important; }
  html.dark .text-slate-400 { color: #64748B !important; }
  html.dark .text-slate-300 { color: #475569 !important; }
  html.dark .text-diesel { color: #8FB0DE !important; }
  html.dark .bg-diesel\/5 { background-color: rgba(143,176,222,0.12) !important; }
  html.dark input, html.dark select, html.dark textarea { color: #F1F5F9; }
  html.dark ::placeholder { color: #64748B; opacity: 1; }
  html.dark .bg-rose-50 { background-color: rgba(225,29,72,0.12) !important; }
  html.dark .text-rose-500 { color: #FB7185 !important; }
  html.dark .text-rose-600 { color: #FB7185 !important; }
</style>
</head>
<body class="min-h-screen pb-24">

  <div id="auth-screen"></div>

  <div id="app-shell" class="hidden">
    <header class="bg-diesel text-white px-4 pt-5 pb-5">
      <div class="flex items-center gap-2 text-xs mb-3" id="user-bar"></div>
      <div id="header-hero"></div>
    </header>

    <main id="app" class="max-w-md mx-auto px-3 mt-4 space-y-3"></main>

    <nav id="nav" class="fixed bottom-0 left-0 right-0 bg-diesel flex justify-around items-center py-2 shadow-[0_-4px_16px_rgba(0,0,0,0.25)] z-10" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));"></nav>
  </div>

  <script src="firebase-config.js"></script>
  <script src="cloud-config.js"></script>
  <script src="vapid-config.js"></script>
  <script src="data.js"></script>
  <script src="offline-queue.js"></script>
  <script src="app.js"></script>
  <script src="docs.js"></script>
  <script src="timesheet.js"></script>
  <script src="stats.js"></script>
  <script src="chat.js"></script>
  <script src="notifications.js"></script>
  <script src="auth.js"></script>
</body>
</html>
